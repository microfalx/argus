<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="list(details)">
    <table class="table table-hover datatable">
        <thead class="table-light">
        <tr>
            <th scope="col" rowspan="2">Name</th>
            <th scope="col" colspan="2" class="text-center">Memory Service</th>
            <th scope="col" colspan="2" class="text-center">Memory Arrays</th>
            <th scope="col" colspan="2" class="text-center">Faults</th>
            <th scope="col" colspan="2" class="text-center">Operations</th>
            <th scope="col" colspan="2" class="text-center">Events</th>
            <th scope="col" colspan="2" class="text-center">Tasks</th>
            <th:block th:if="${details}">
            <th scope="col" rowspan="2">Info</th>
            </th:block>
        </tr>
        <tr>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total memory usage of the service">Total</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of objects in the service">Objects</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total memory usage of the arrays (included in total memory usage of the service)">Total</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of elements in the arrays">Elements</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of warnings received from the logger for the service">Warnings</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of errors received from the logger for the service">Errors</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of successful operations (internal tasks) executed by the service">Successful</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of failed operations (internal tasks) executed by the service">Failed</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of incoming events (any data received by the service)">In</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of outgoing events (any data sent by the service)">Out</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of running tasks (task processing events/data for the service)">Running</th>
            <th scope="col" class="text-end" data-toggle="tooltip" title="Total number of pending tasks (task waiting to be processed for the service)">Pending</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="service : ${helper.getServices(services)}">
            <td><span th:text="${service.name}"></span></td>
            <td class="text-nowrap">
                <span th:text="${helper.formatBytes(service.memoryUsage)}"></span>
                <th:block th:if="${details}">
                <span class="d-none sparkline-bar sparkline-memory"
                      th:text="${helper.getTrendMemory(service, 25)}"></span>
                </th:block>
                <span class="ms-1" th:utext="${helper.getTrendMemoryGlyph(service)}"></span>
            </td>
            <td class="text-end text-nowrap">
                <span th:text="${helper.formatCount(service.memoryObjects)}"></span>
            </td>
            <td class="text-end text-nowrap">
                <span th:text="${helper.formatBytes(service.memoryArrayUsage)}"></span>
            </td>
            <td class="text-end text-nowrap">
                <span th:text="${helper.formatCount(service.memoryArrayObjects)}"></span>
            </td>
            <td class="text-end" th:text="${helper.formatNumber(service.warningCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.errorCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.successCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.failedCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.eventInCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.eventOutCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.taskRunningCount)}"></td>
            <td class="text-end" th:text="${helper.formatNumber(service.taskPendingCount)}"></td>
            <th:block th:if="${details}">
            <td>
                <span data-toggle="tooltip" th:title="${helper.getTooltip(service)}">
                    <i class="fa-solid fa-circle-info"></i>
                </span>
            </td>
            </th:block>
        </tr>
        </tbody>
    </table>
</div>


</body>
</html>
