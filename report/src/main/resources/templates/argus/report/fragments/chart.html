<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="code" th:remove="tag">
</div>

<div th:fragment="pie(chart)" th:remove="tag">
    <script th:inline="javascript">
        renderPieChart({
            id: [[${chart.id}]],
            title: {
                text: [[${chart.name}]],
            },
            legend: {
                show: [[${chart.legend.show}]]
            },
            series: [[${chart.getSeries()}]],
            chart: {
                width: [[${chart.width}]],
                height: [[${chart.height}]]
            },
            labels: [[${chart.getLabels()}]]
        });
    </script>
</div>

<div th:fragment="bar(chart)" th:remove="tag">
    <script th:inline="javascript">
        renderBarChart({
            id: [[${chart.id}]],
            series: [{
                name: [[${chart.getSeriesName()}]],
                data: [[${chart.getSeries()}]]
            }],
            chart: {
                width: [[${chart.width}]],
                height: [[${chart.height}]]
            },
            title: {
                text: [[${chart.name}]]
            },
            xaxis: {
                categories: [[${chart.getLabels()}]]
            }
        });
    </script>
</div>

<div th:fragment="column(chart)" th:remove="tag">
    <script th:inline="javascript">
        renderColumnChart({
            id: [[${chart.id}]],
            series: [{
                name: [[${chart.getSeriesName()}]],
                data: [[${chart.getSeries()}]]
            }],
            chart: {
                width: [[${chart.width}]],
                height: [[${chart.height}]],
            },
            xaxis: {
                categories: [[${chart.getLabels()}]]
            },
            title: {
                text: [[${chart.name}]],
            }
        });
    </script>
</div>

<div th:fragment="area(chart)" th:remove="tag">
    <script th:inline="javascript">
        renderAreaChart({
            id: [[${chart.id}]],
            unit: [[${chart.yaxis.unit}]],
            series: [[${chart.getSeries()}]],
            chart: {
                width: [[${chart.width}]],
                height: [[${chart.height}]],
                stacked: [[${chart.stacked}]]
            },
            title: {
                text: [[${chart.name}]]
            },
            xaxis: {
                type: [[${chart.getXDataType()}]]
            }
        });
    </script>
</div>

<div th:fragment="treemap(chart)" th:remove="tag">
    <script th:inline="javascript">
        renderTreeMapChart({
            id: [[${chart.id}]],
            unit: [[${chart.yaxis.unit}]],
            series: [{
                data: [[${chart.getData()}]],
            }],
            legend: {
                show: [[${chart.legend.show}]]
            },
            title: {
                text: [[${chart.name}]],
            },
            chart: {
                width: [[${chart.width}]],
                height: [[${chart.height}]]
            }
        });
    </script>
</div>

<div th:fragment="render" th:remove="tag">
    <div th:replace="~{fragments/chart :: utils}"></div>
</div>
</body>
</html>
