<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(title, resource, all)" class="col-md-6">
    <div class="card">
        <div class="ribbon ribbon-top" th:classappend="${helper.getRibbonCls(resource.health.severity)}">
            <span th:text="${helper.formatNumber(resource.health.score)}"></span>
        </div>
        <div class="card-body">
            <h3 class="card-title" th:text="${title}"></h3>
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th scope="col" style="width:200px">Group</th>
                    <th scope="col" style="width:100px">Score</th>
                    <th scope="col" style="width:70%">Trend</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="group : ${resource.health.getGroups(all)}">
                    <td class="text-nowrap" th:style="${helper.getGroupStyle(group)}"><i th:if="${group.depth > 1}" th:class="${helper.getGroupIcon(group)}"></i><span th:text="${group.name}" ></span></td>
                    <td class="text-nowrap"><span th:text="${helper.formatNumber(group.score)}" th:classappend="${helper.getBadgeFromScoreCls(group.score)}"></span></td>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
