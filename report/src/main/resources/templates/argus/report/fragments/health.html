<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(title, resource)" class="col-md-6 col-lg-3">
    <div class="card">
        <div class="ribbon ribbon-top" th:classappend="${helper.getCls(resource.health.severity)}">
            <span th:text="${helper.formatNumber(resource.health.score)}"></span>
        </div>
        <div class="card-body">
            <h3 class="card-title" th:text="${title}"></h3>
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th scope="col">Group</th>
                    <th scope="col">Score</th>
                    <th scope="col">Trend</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="group : ${resource.health.groups}">
                    <td><span th:text="${group.name}"></span></td>
                    <td><span th:text="${helper.formatNumber(group.score)}"></span></td>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:fragment="content" class="container-fluid">
    <div class="row row-cards">
        <h3 th:replace="~{fragments/health :: card('Service', ${serviceResource})}"></h3>
        <h3 th:replace="~{fragments/health :: card('Server', ${serverResource})}"></h3>
    </div>
</div>
`
</body>
</html>
