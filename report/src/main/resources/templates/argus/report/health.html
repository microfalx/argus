<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="cards(all)" th:remove="tag">
    <th:block th:if="${email}">
        <table class="table-light">
            <tr class="align-top">
                <td><div th:replace="~{fragments/health :: card('Service', ${serviceResource}, ${all})}"></div></td>
                <td class="m-2"><div th:replace="~{fragments/health :: card('Server', ${serverResource}, ${all})}"></div></td>
                <td class="m-2">
                    <th:block th:if="${databaseResource}">
                        <div th:replace="~{fragments/health :: card('Database', ${databaseResource}, ${all})}"></div>
                    </th:block>
                </td>
            </tr>
            <tr class="align-top">
                <td>
                    <th:block th:if="${cacheResource}">
                        <div th:replace="~{fragments/health :: card('Cache', ${cacheResource}, ${all})}"></div>
                    </th:block>
                </td>
                <td class="m-2">
                    <th:block th:if="${brokerResource}">
                        <div th:replace="~{fragments/health :: card('Broker', ${brokerResource}, ${all})}"></div>
                    </th:block>
                </td>
                <td class="m-2"></td>
            </tr>
        </table>
    </th:block>
    <th:block th:unless="${email}">
        <div th:replace="~{fragments/health :: card('Service', ${serviceResource}, ${all})}"></div>
        <div th:replace="~{fragments/health :: card('Server', ${serverResource}, ${all})}"></div>
        <th:block th:if="${databaseResource}">
            <div th:replace="~{fragments/health :: card('Database', ${databaseResource}, ${all})}"></div>
        </th:block>
        <th:block th:if="${cacheResource}">
            <div th:replace="~{fragments/health :: card('Cache', ${cacheResource}, ${all})}"></div>
        </th:block>
        <th:block th:if="${brokerResource}">
            <div th:replace="~{fragments/health :: card('Broker', ${brokerResource}, ${all})}"></div>
        </th:block>
    </th:block>
</div>

<div th:fragment="content" class="container-fluid">
    <div class="row row-cards">
        <div th:replace="~{health :: cards(true)}"></div>
    </div>
</div>

<div th:fragment="code" th:remove="tag">
</div>

</body>
</html>
